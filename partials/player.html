    <footer class="player-dock" id="playerDock">
      <div class="player-track">
        <div class="player-art" id="playerArt">CW</div>
        <div class="player-track-copy">
          <strong id="playerTitle">Nessuna traccia in ascolto</strong>
          <span id="playerMeta">Apri una preview o un file dal catalogo.</span>
        </div>
      </div>

      <div class="player-center">
        <span id="playerState" class="player-state">Idle</span>
        <div class="player-control-row">
          <button id="playerShuffleButton" class="player-mode-control" type="button" aria-label="Attiva shuffle" aria-pressed="false">
            ⤨
          </button>
          <button id="playerPrevButton" class="player-control" type="button" aria-label="Traccia precedente">
            ‹‹
          </button>
          <button id="playerToggleButton" class="player-toggle" type="button" aria-label="Play o pausa">
            ▶
          </button>
          <button id="playerNextButton" class="player-control" type="button" aria-label="Traccia successiva">
            ››
          </button>
          <button id="playerRepeatButton" class="player-mode-control" type="button" aria-label="Cambia modalita' repeat" aria-pressed="false">
            ↻
          </button>
        </div>
        <div class="player-progress">
          <span id="playerProgress"></span>
          <input id="playerSeekRange" type="range" min="0" max="100" step="1" value="0" aria-label="Posizione brano" />
        </div>
        <span id="playerTime" class="player-time">0:00 / 0:00</span>
      </div>

      <div class="player-actions">
        <label class="volume-control" aria-label="Volume player">
          <span id="playerVolumeIcon">Vol</span>
          <input id="playerVolumeRange" type="range" min="0" max="100" step="1" value="80" />
          <span id="playerVolumeValue">80%</span>
        </label>
      </div>
    </footer>

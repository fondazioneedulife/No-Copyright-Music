<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClearWave Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 1.25rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-bottom: 16px;
      background-color: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 4px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0ea5e9;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0284c7;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 0.875rem;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .status-success {
      background-color: #064e3b;
      color: #34d399;
      display: block !important;
    }
    .status-error {
      background-color: #7f1d1d;
      color: #fca5a5;
      display: block !important;
    }
    .status-info {
      background-color: #1e3a8a;
      color: #93c5fd;
      display: block !important;
    }
  </style>
</head>
<body>
  <h2>ClearWave Sync</h2>
  
  <label for="serverUrl">Indirizzo Server ClearWave</label>
  <input type="text" id="serverUrl" placeholder="es. http://10.30.10.147:3000">
  
  <label for="adminPassword">Password Admin</label>
  <input type="password" id="adminPassword" placeholder="La tua password">
  
  <button id="syncBtn">Sincronizza Cookie Ora</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

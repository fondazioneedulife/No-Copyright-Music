services:
  clearwave:
    # Compose avvia un solo servizio: backend + UI React principale, con legacy solo come fallback.
    build:
      context: .
      dockerfile: Dockerfile
    image: clearwave-library:local
    container_name: clearwave-library
    init: true
    privileged: ${CLEARWAVE_DOCKER_PRIVILEGED:-false}
    restart: unless-stopped
    ports:
      - "${CLEARWAVE_PORT:-3000}:3000"
    environment:
      PORT: 3000
      CLEARWAVE_DATA_DIR: /app/data
      CLEARWAVE_UPLOADS_DIR: /app/uploads
      CLEARWAVE_ENABLE_DEMOS: "${CLEARWAVE_ENABLE_DEMOS:-0}"
      CLEARWAVE_AUTO_EXPAND: "${CLEARWAVE_AUTO_EXPAND:-0}"
      CLEARWAVE_ADMIN_PASSWORD: "${CLEARWAVE_ADMIN_PASSWORD:-admin123}"
      JAMENDO_CLIENT_ID: "${JAMENDO_CLIENT_ID:-}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      AUDIUS_API_KEY: "${AUDIUS_API_KEY:-}"
      THEAUDIODB_API_KEY: "${THEAUDIODB_API_KEY:-}"
      # Player server-side per Raspberry Pi (audio via ALSA)
      CLEARWAVE_SERVER_PLAYER: "${CLEARWAVE_SERVER_PLAYER:-1}"
      CLEARWAVE_PLAYER_COMMAND: "${CLEARWAVE_PLAYER_COMMAND:-mpv}"
      CLEARWAVE_SERVER_VOLUME: "${CLEARWAVE_SERVER_VOLUME:-75}"
      CLEARWAVE_AUDIO_OUTPUT: "${CLEARWAVE_AUDIO_OUTPUT:-alsa}"
      CLEARWAVE_AUDIO_DEVICE: "${CLEARWAVE_AUDIO_DEVICE:-}"
      ALSA_CARD: "${ALSA_CARD:-}"
      # YouTube sul server: forza uno stream audio e usa il binario yt-dlp aggiornato dell'immagine.
      CLEARWAVE_YTDL_PATH: "${CLEARWAVE_YTDL_PATH:-/usr/bin/yt-dlp}"
      CLEARWAVE_YTDL_FORMAT: "${CLEARWAVE_YTDL_FORMAT:-bestaudio[acodec!=none]/bestaudio/best[acodec!=none]/best}"
    # File Docker unico: su Raspberry prova prima con CLEARWAVE_DOCKER_PRIVILEGED=true.
    # Se l'audio host non viene esposto, puoi ancora sbloccare il device qui sotto.
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio
    volumes:
      # Bind mount: Docker usa gli stessi dati del progetto, quindi catalogo e utenti non ripartono vuoti.
      - ./data:/app/data
      - ./uploads:/app/uploads
